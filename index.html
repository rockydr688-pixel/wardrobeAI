<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WardrobeAI — Next-Gen Smart Wardrobe & AI Stylist</title>
    <meta name="description" content="Elevate your style with WardrobeAI. Your intelligent AI wardrobe manager, outfit generator, laundry tracker, packing assistant, and smart shopping advisor." />
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#7C3AED',
              secondary: '#A855F7',
              accent: '#06B6D4',
              background: '#09090B',
              card: 'rgba(255,255,255,0.08)',
              glassBorder: 'rgba(255,255,255,0.15)',
              textPrimary: '#FFFFFF',
              textSecondary: '#A1A1AA',
              success: '#22C55E',
              warning: '#F59E0B',
              danger: '#EF4444',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Outfit', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 3s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-12px)' },
              },
              glow: {
                '0%': { filter: 'drop-shadow(0 0 15px rgba(124, 58, 237, 0.4))' },
                '100%': { filter: 'drop-shadow(0 0 35px rgba(6, 182, 212, 0.7))' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(168, 85, 247, 0.4);
        box-shadow: 0 12px 40px -10px rgba(124, 58, 237, 0.25);
      }
      .text-gradient {
        background: linear-gradient(135deg, #FFFFFF 0%, #A855F7 50%, #06B6D4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="bg-[#09090B] text-white font-sans antialiased selection:bg-purple-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
